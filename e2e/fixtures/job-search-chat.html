<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Job Search Chat — E2E fixture</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/popup.css">
    <!-- This fixture stands in for the assistant panel, not for the workspace shell: the rail keeps its full
         width beside the docked panel, as mobile-width.spec.ts pins it for this page. The real page collapses
         the rail beside an open panel below 1440px. -->
    <style>
        @media (min-width: 1280px) and (max-width: 1439.98px) {
            body.assistant-docked { --app-rail-width: 240px; }
            body.assistant-docked .app-nav-rail { width: 240px; }
        }
    </style>
</head>
<body>
    <a href="#main-content" class="skip-to-content" data-skip-to-content>Skip to content</a>
    <div class="app-shell">
        <aside class="app-nav-rail" aria-label="Application navigation" data-nav-rail>
            <nav class="app-nav" aria-label="Main navigation">
                <a href="/" class="app-nav-brand" aria-label="CRank home">
                    <span aria-hidden="true">★</span>
                    <span class="app-nav-brand-text">CRank</span>
                </a>
                <ul class="app-nav-list" role="list">
                    <li><a href="/" id="nav-rankings" class="app-nav-link"><span aria-hidden="true">★</span><span class="app-nav-label">Company Rankings</span></a></li>
                    <li><a href="/chat/" id="nav-job-search" class="app-nav-link app-nav-link--active" aria-current="page"><span aria-hidden="true">💬</span><span class="app-nav-label">Job Search</span></a></li>
                    <li><a href="/help/" id="nav-help" class="app-nav-link"><span aria-hidden="true">?</span><span class="app-nav-label">Help</span></a></li>
                    <li><a href="/admin/" id="nav-admin" class="app-nav-link"><span aria-hidden="true">⚙</span><span class="app-nav-label">Admin</span></a></li>
                </ul>
            </nav>
        </aside>
        <header class="app-mobile-topbar">
            <button class="app-nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open navigation menu" data-nav-toggle>
                <span aria-hidden="true">≡</span>
            </button>
        </header>
        <div class="app-nav-drawer" id="mobile-nav" data-nav-drawer hidden></div>
        <div class="app-nav-overlay" data-nav-overlay hidden></div>
    </div>
    <div class="container mt-3 app-messages" role="status" aria-live="polite">
        <div class="alert alert-info" role="alert">Welcome back — your conversation was restored.</div>
    </div>
    <main id="main-content" class="app-content" tabindex="-1">
        <div class="container py-4 page-container">
            <div class="row">
                <div class="col-12 col-lg-8">
                    <p class="text-muted">Results</p>
                </div>
            </div>
        </div>
    </main>
    <!-- The chat mounts where production mounts it: inside the assistant panel, whose flex column gives the
         card its height (issue #483). The panel mode follows the viewport width, like the workspace shell. -->
    <aside class="assistant-panel" id="fixture-panel" aria-label="Assistant">
        <div class="assistant-panel-inner">
            <!-- The sheet's header as workspace/AssistantPanel.tsx renders it: Back to results ahead of the title row. -->
            <button type="button" class="btn btn-outline-light assistant-back-to-results" id="fixture-back" data-testid="assistant-back-to-results" hidden>
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
                <span class="assistant-back-label">Back to results</span>
            </button>
            <div class="assistant-panel-header">
                <div class="assistant-panel-heading">
                    <h2 class="assistant-panel-title" id="assistant-panel-title" tabindex="-1"><i class="fa-solid fa-comments" aria-hidden="true"></i> Job Search Assistant</h2>
                </div>
                <div class="assistant-panel-controls">
                    <button type="button" class="btn btn-sm btn-outline-light assistant-panel-control" aria-label="Minimize assistant" data-testid="assistant-minimize"><i class="fa-solid fa-window-minimize" aria-hidden="true"></i><span class="assistant-panel-control-label" aria-hidden="true">Minimize</span></button>
                    <button type="button" class="btn btn-sm btn-outline-light assistant-panel-control assistant-panel-control--close" aria-label="Close assistant" data-testid="assistant-close"><i class="fa-solid fa-xmark" aria-hidden="true"></i><span class="assistant-panel-control-label" aria-hidden="true">Close</span></button>
                </div>
            </div>
            <div class="assistant-panel-body" data-testid="assistant-panel-body">
                <!-- The app's collapsed priorities row (copied from the real page), so the bars sit where they do there. -->
                <section class="priorities-section priorities-sidebar" aria-labelledby="priorities-title-sidebar" data-testid="priorities-sidebar"><span class="visually-hidden" role="status" data-testid="priorities-announcement"></span><div class="priorities-summary-row"><h2 class="priorities-summary-heading"><button type="button" class="priorities-summary-toggle" data-testid="priorities-summary-toggle" aria-expanded="false" aria-controls="priorities-details-sidebar"><span class="priorities-summary-text"><span id="priorities-title-sidebar" class="priorities-summary-title">Your priorities<i class="fa-solid fa-chevron-down priorities-summary-chevron" aria-hidden="true"></i></span><span class="priorities-summary" data-testid="priorities-summary"><span class="priorities-summary-first"><span class="priorities-summary-lead">Requires: $150,000,</span></span><span class="priorities-summary-sep"> </span><span class="priorities-summary-tail">+3 · 6 preferences</span></span></span></button></h2><button type="button" class="btn btn-sm btn-outline-primary priorities-edit">Edit<span class="visually-hidden"> priorities</span></button></div><div id="priorities-details-sidebar" class="priorities-details" hidden=""></div></section>
                <div id="job-search-chat"></div>
            </div>
        </div>
    </aside>
    <script>
        (function () {
            var panel = document.getElementById('fixture-panel');
            function apply() {
                var mode = window.innerWidth < 768 ? 'sheet' : window.innerWidth < 1280 ? 'drawer' : 'docked';
                panel.className = 'assistant-panel assistant-panel--' + mode;
                document.getElementById('fixture-back').hidden = mode !== 'sheet';
                document.body.classList.remove('assistant-docked', 'assistant-drawer', 'assistant-sheet');
                document.body.classList.add('assistant-' + mode);
            }
            apply();
            window.addEventListener('resize', apply);
        })();
    </script>
    <!-- Single shared "Suggest a company" host (issue #471): outside .app-shell/main.app-content per the modal isolation contract -->
    <div id="suggest-company-host"></div>
    <script src="/static/dist/e2e.js"></script>
</body>
</html>
