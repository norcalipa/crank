<!-- E2E fixture for issue #464: company details dialog layering and keyboard
     focus versus the fixed navigation rail. Combines the navigation shell
     markup with the live OrganizationList component mount. Deliberately a
     separate file so it cannot conflict with concurrent fixture edits. -->
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Organization Popup Layering — E2E fixture</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/popup.css">
    <style>
        /* Inline minimal icon substitutes for E2E fixture (FontAwesome not installed in worktree) */
        .fa-solid, .fab { font-style: normal; }
        .fa-ranking-star::before { content: "★"; }
        .fa-comments::before { content: "💬"; }
        .fa-circle-question::before { content: "?"; }
        .fa-gear::before { content: "⚙"; }
        .fa-user-circle::before { content: "●"; }
        .fa-right-from-bracket::before { content: "⇲"; }
        .fa-bars::before { content: "≡"; font-size: 1.5rem; }
        .fa-xmark::before { content: "✕"; }
    </style>
</head>
<body>
<a href="#main-content" class="skip-to-content" data-skip-to-content>Skip to content</a>
<div class="app-shell">
    <aside class="app-nav-rail" aria-label="Application navigation" data-nav-rail>
        <nav class="app-nav" aria-label="Main navigation">
            <a href="/" class="app-nav-brand" aria-label="CRank home">
                <span class="fa-solid fa-ranking-star" aria-hidden="true"></span>
                <span class="app-nav-brand-text">CRank</span>
            </a>
            <ul class="app-nav-list" role="list">
                <li>
                    <a href="/" id="nav-rankings" class="app-nav-link app-nav-link--active" aria-current="page">
                        <span class="fa-solid fa-ranking-star" aria-hidden="true"></span>
                        <span class="app-nav-label">Company Rankings</span>
                    </a>
                </li>
                <li>
                    <a href="/chat/" id="nav-job-search" class="app-nav-link">
                        <span class="fa-solid fa-comments" aria-hidden="true"></span>
                        <span class="app-nav-label">Job Search</span>
                    </a>
                </li>
                <li>
                    <a href="/help/" id="nav-help" class="app-nav-link">
                        <span class="fa-solid fa-circle-question" aria-hidden="true"></span>
                        <span class="app-nav-label">Help</span>
                    </a>
                </li>
                <li>
                    <a href="/admin/" id="nav-admin" class="app-nav-link">
                        <span class="fa-solid fa-gear" aria-hidden="true"></span>
                        <span class="app-nav-label">Admin</span>
                    </a>
                </li>
            </ul>
            <div class="app-nav-footer">
                <div class="app-nav-user" id="nav-account">
                    <span class="fa-solid fa-user-circle" aria-hidden="true"></span>
                    <span class="app-nav-label">testuser</span>
                </div>
            </div>
        </nav>
    </aside>
    <button class="app-nav-toggle" type="button" aria-expanded="false" aria-controls="mobile-nav" aria-label="Open navigation menu" data-nav-toggle>
        <span class="fa-solid fa-bars" aria-hidden="true"></span>
    </button>
    <div class="app-nav-drawer" id="mobile-nav" data-nav-drawer hidden>
        <div class="app-nav-drawer-header">
            <a href="/" class="app-nav-brand" aria-label="CRank home">
                <span class="fa-solid fa-ranking-star" aria-hidden="true"></span>
                <span class="app-nav-brand-text">CRank</span>
            </a>
            <button type="button" class="app-nav-drawer-close" aria-label="Close navigation menu" data-nav-close>
                <span class="fa-solid fa-xmark" aria-hidden="true"></span>
            </button>
        </div>
        <nav class="app-nav" aria-label="Mobile navigation">
            <ul class="app-nav-list" role="list">
                <li><a href="/" class="app-nav-link app-nav-link--active" aria-current="page"><span class="fa-solid fa-ranking-star" aria-hidden="true"></span><span class="app-nav-label">Company Rankings</span></a></li>
                <li><a href="/chat/" class="app-nav-link"><span class="fa-solid fa-comments" aria-hidden="true"></span><span class="app-nav-label">Job Search</span></a></li>
                <li><a href="/help/" class="app-nav-link"><span class="fa-solid fa-circle-question" aria-hidden="true"></span><span class="app-nav-label">Help</span></a></li>
                <li><a href="/admin/" class="app-nav-link"><span class="fa-solid fa-gear" aria-hidden="true"></span><span class="app-nav-label">Admin</span></a></li>
            </ul>
        </nav>
    </div>
    <div class="app-nav-overlay" data-nav-overlay hidden></div>
</div>
<main id="main-content" class="app-content" tabindex="-1">
    <div class="container py-4 page-container">
        <div class="row">
            <div class="col-12">
                <div id="organization-list"></div>
            </div>
        </div>
    </div>
</main>
