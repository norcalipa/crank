# Read-only job-inventory health probe. Emits the inventory_health New Relic
# event and exits non-zero when the inventory is unhealthy so the job's failure
# can be observed. Set suspend: false only after the bootstrap is complete and
# the inventory_health alerts in docs/monitoring.yaml are wired to a policy.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crank-healthcheck
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
    app.kubernetes.io/component: crawl-healthcheck
spec:
  schedule: "*/15 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crank
            app.kubernetes.io/instance: crank
            app.kubernetes.io/component: crawl-healthcheck
        spec:
          restartPolicy: OnFailure
          serviceAccountName: crank-agent
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: crank-agent
              image: ghcr.io/norcalipa/crank/crank:${GITHUB_SHA}
              imagePullPolicy: Always
              command: ["python", "manage.py", "crawl_healthcheck"]
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "64Mi"
                  cpu: "50m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
              envFrom:
                - configMapRef:
                    name: crank-config
                - configMapRef:
                    name: crank-agent-config
                - secretRef:
                    name: db-connect-credentials
          imagePullSecrets:
            - name: ghcr-credentials
          volumes:
            - name: tmp
              emptyDir: {}
