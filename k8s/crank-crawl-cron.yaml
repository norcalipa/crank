# Disabled-by-default freshness schedules for bounded company and job crawls.
# Set CRAWL_CRON_ENABLED and AGENT_RUN_ENABLED to true in the agent ConfigMap,
# then set suspend: false only after approved source rows and provider secrets
# have been reviewed. Each phase has its own schedule and singleton guard.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crank-crawl-organizations
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
    app.kubernetes.io/component: crawl-organizations
spec:
  schedule: "0 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crank
            app.kubernetes.io/instance: crank
            app.kubernetes.io/component: crawl-organizations
        spec:
          restartPolicy: OnFailure
          serviceAccountName: crank-agent
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: crank-agent
              image: ghcr.io/norcalipa/crank/crank:${GITHUB_SHA}
              imagePullPolicy: Always
              command: ["python", "manage.py", "schedule_crawls", "--phase", "organization"]
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: crank-config
                - configMapRef:
                    name: crank-agent-config
                - secretRef:
                    name: db-connect-credentials
                - secretRef:
                    name: crank-capability-secrets
          imagePullSecrets:
            - name: ghcr-credentials
          volumes:
            - name: tmp
              emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crank-crawl-jobs
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
