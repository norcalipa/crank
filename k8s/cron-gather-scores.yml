# Disabled-by-default score gathering schedule. Enable both the CronJob and
# GATHER_SCORES_ENABLED/AGENT_RUN_ENABLED in the agent ConfigMap only after
# source policy and credentials have been reviewed.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crank-gather-scores
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
    app.kubernetes.io/component: score-gathering
spec:
  schedule: "*/15 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crank
            app.kubernetes.io/instance: crank
            app.kubernetes.io/component: score-gathering
        spec:
          restartPolicy: OnFailure
          serviceAccountName: crank-agent
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: crank-agent
              image: ghcr.io/norcalipa/crank/crank:${GITHUB_SHA}
              imagePullPolicy: Always
              command: ["python", "manage.py", "gather_scores"]
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "512Mi"
                  cpu: "500m"
              envFrom:
                - configMapRef:
                    name: crank-config
                - configMapRef:
                    name: crank-agent-config
                - secretRef:
                    name: db-connect-credentials
          imagePullSecrets:
            - name: ghcr-credentials
          volumes:
            - name: tmp
              emptyDir: {}
