# Kubernetes Secret for production capability credentials (issue #440).
#
# This manifest defines the STRUCTURE of the capability secrets. It is
# applied with `kubectl create secret --dry-run=client` in the deploy
# workflow so it creates the Secret if it does not exist but NEVER
# overwrites values that an operator has already populated out-of-band.
#
# NEVER commit real credential values. Populate via:
#   kubectl -n crank create secret generic crank-capability-secrets \
#     --from-literal=LLM_API_KEY='sk-...' \
#     --from-literal=YELP_API_KEY='...' \
#     --from-literal=USAJOBS_AUTH_KEY='...' \
#     --from-literal=USAJOBS_USER_AGENT_EMAIL='...' \
#     --from-literal=FIRECRAWL_API_KEY='...'
#
# Or update in place:
#   kubectl -n crank create secret generic crank-capability-secrets \
#     --from-literal=LLM_API_KEY='sk-...' --dry-run=client -o yaml | \
#     kubectl apply -f -
---
apiVersion: v1
kind: Secret
metadata:
  name: crank-capability-secrets
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
    app.kubernetes.io/component: capability-secrets
type: Opaque
stringData:
  # All values default to empty. The readiness probe and Django system
  # checks enforce fail-closed: an enabled capability with an empty key
  # holds readiness false and raises a system-check error.
  LLM_API_KEY: ""
  YELP_API_KEY: ""
  USAJOBS_AUTH_KEY: ""
  USAJOBS_USER_AGENT_EMAIL: ""
  FIRECRAWL_API_KEY: ""
