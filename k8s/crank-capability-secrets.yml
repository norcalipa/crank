# Kubernetes Secret for production capability credentials (issue #440).
#
# This manifest documents the STRUCTURE of the capability secrets. It is
# never applied. The deploy workflows create the Secret, with empty values,
# only when the cluster reports it absent. They never overwrite it, so the
# values an operator has populated out-of-band survive every deploy.
#
# NEVER commit real credential values. To populate or rotate a key, follow
# docs/capability-config-contract.md ("Populate or rotate a credential").
# Never run `kubectl apply` on this Secret: it would overwrite every key with the empty value
# below (and an apply with fewer keys drops the rest).
---
apiVersion: v1
kind: Secret
metadata:
  name: crank-capability-secrets
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
    app.kubernetes.io/component: capability-secrets
type: Opaque
stringData:
  # All values default to empty. The readiness probe and Django system
  # checks enforce fail-closed: an enabled capability with an empty key
  # holds readiness false and raises a system-check error.
  LLM_API_KEY: ""
  YELP_API_KEY: ""
  USAJOBS_AUTH_KEY: ""
  USAJOBS_USER_AGENT_EMAIL: ""
  FIRECRAWL_API_KEY: ""
