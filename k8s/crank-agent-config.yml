---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crank-agent-config
  namespace: crank
data:
  # Scheduled agent runs are disabled by default. Flip a flag to "true" only
  # after the run contract, secrets, and policies are ready
  # (roadmap: docs/readme.md section 8.1). The command itself also enforces
  # these settings, so the CronJob does no work until a flag is enabled.
  AGENT_RUN_ENABLED: "false"
  AGENT_NOOP_ENABLED: "false"
  GATHER_SCORES_ENABLED: "false"
  GATHER_SCORES_DEADLINE_SECONDS: "300"
  GATHER_SCORES_SOURCE_TIMEOUT_SECONDS: "120"
  JOB_PIPELINE_ENABLED: "false"
  CRAWL_CRON_ENABLED: "false"
  ORGANIZATION_FRESHNESS_HOURS: "168"
  JOB_FRESHNESS_HOURS: "24"
  ORGANIZATION_CRAWL_CRON: "0 */6 * * *"
  JOB_CRAWL_CRON: "*/15 * * * *"
  CRAWL_MAX_SOURCES: "10"
  CRAWL_MAX_JOB_LISTINGS: "100"
  CRAWL_MAX_PAGES: "10"
  CRAWL_DEADLINE_SECONDS: "300"
  # Consecutive failed crawls that mark a source as repeatedly failing in the
  # read-only inventory health check.
  CRAWL_REPEATED_FAILURE_THRESHOLD: "3"
  # Interactive job-search agent (Phase 6). Disabled by default; enabling
  # requires LLM secrets (API key, model) to be configured via a Kubernetes
  # Secret and referenced here. The "demo" provider is the offline/test
  # default; set JOB_SEARCH_PROVIDER to "orchestrator" for production.
  INTERACTIVE_AGENT_ENABLED: "false"
  JOB_SEARCH_PROVIDER: "demo"
  # LLM provider settings. Values are non-secret; the API key must come from
  # a Secret, not this ConfigMap. LLM_PROVIDER selects the adapter class;
  # empty => fail closed (no provider).
  LLM_PROVIDER: ""
  LLM_MODEL: ""
  LLM_TIMEOUT_SECONDS: "30"
  LLM_MAX_TOKENS: "2048"
  LLM_PER_USER_COST_LIMIT_USD: "0"
  LLM_PRICE_PER_1K_TOKENS_USD: "0"
