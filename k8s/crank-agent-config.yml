---
apiVersion: v1
kind: ConfigMap
metadata:
  name: crank-agent-config
  namespace: crank
data:
  # Scheduled agent runs are disabled by default. Flip a flag to "true" only
  # after the run contract, secrets, and policies are ready
  # (roadmap: docs/readme.md section 8.1). The command itself also enforces
  # these settings, so the CronJob does no work until a flag is enabled.
  AGENT_RUN_ENABLED: "false"
  AGENT_NOOP_ENABLED: "false"
  GATHER_SCORES_ENABLED: "false"
  GATHER_SCORES_DEADLINE_SECONDS: "300"
  GATHER_SCORES_SOURCE_TIMEOUT_SECONDS: "120"
  JOB_PIPELINE_ENABLED: "false"
  CRAWL_CRON_ENABLED: "false"
  ORGANIZATION_FRESHNESS_HOURS: "168"
  JOB_FRESHNESS_HOURS: "24"
  ORGANIZATION_CRAWL_CRON: "0 */6 * * *"
  JOB_CRAWL_CRON: "*/15 * * * *"
  CRAWL_MAX_SOURCES: "10"
  CRAWL_MAX_JOB_LISTINGS: "100"
  CRAWL_MAX_PAGES: "10"
  CRAWL_DEADLINE_SECONDS: "300"
