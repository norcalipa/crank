#
# Machine-readable external job source catalog for Phase 3 (#316).
# Human-readable governance record: docs/job-source-catalog.md.
# Unknown access, license, retention, or display conditions are blockers.

review:
  document: docs/job-source-catalog.yaml
  issue: 316
  review_date: 2026-08-10
  reviewed_by: autonomous agent (implementation of #316)
  decision_owner: maintainer (crank.fyi)
  methodology: >
    Reviewed official API/feed documentation for each candidate and recorded
    access, authorization, terms/license, robots policy, rate limits, pagination,
    retention, identity, fields, matching/presentation use, and blockers. No
    credentials, live responses, applicant data, or licensed datasets were
    stored. Terms must be re-verified before live enablement.

live_enabled: false
mvp:
  source: USAJOBS
  rationale: >
    USAJOBS has the strongest documented API candidate, but it remains pending:
    the reviewed materials do not establish a license or source-specific
    permission for Crank's proposed retention and presentation. No source in
    this catalog currently meets the full approval criteria, so no MVP source
    may be invoked.
  live_enabled: false
  fixture_strategy: >
    Use synthetic fixtures matching the documented Search response shape. Include
    only source-scoped ID, title, agency, location, salary/date fields, and a
    canonical URL; never commit credentials, live payloads, applicant data, or
    copied full announcement text.
  data_classification: public_job_opportunity_metadata
  job_text_retained: false
  job_text_displayed: false
  deletion_policy: >
    Delete or tombstone closed, deleted, and expired listings and all derived
    search documents, caches, embeddings, and fixture copies. Purge stale
    records no later than 30 days after last successful confirmation unless a
    later source-specific review sets a shorter period.
  ssrf_allowlist:
    - data.usajobs.gov
    - developer.usajobs.gov
    - www.opm.gov
    - www.usajobs.gov

ssrf:
  allowlist:
    - data.usajobs.gov
    - developer.usajobs.gov
    - www.opm.gov
    - www.usajobs.gov
  require_https: true
  deny_private_and_link_local_addresses: true
  deny_unlisted_redirects: true
  user_supplied_urls: denied

data_classification:
  approved_mvp: none_pending_source_review
  source_responses: untrusted_external_data
  prohibited: applicant_data_resumes_contact_details_inferred_sensitive_attributes
  raw_payload_retention: none
  job_text_retained: false
  job_text_displayed: false

sources:
  - name: USAJOBS
    url: https://data.usajobs.gov/
    kind: external
    approval_state: pending
    approval:
      state: pending
      owner: maintainer
      review_date: 2026-08-10
      evidence:
        - https://developer.usajobs.gov/api-reference/
        - https://developer.usajobs.gov/api-reference/get-api-search
        - https://developer.usajobs.gov/guides/authentication
        - https://developer.usajobs.gov/guides/rate-limiting
        - https://developer.usajobs.gov/guides/terms-of-use
        - https://www.opm.gov/developer/
      notes: >
        Pending: the cited API description is not a license and the Terms of Use
        page does not establish Crank's proposed retention or presentation use.
        No live access or fixture-backed implementation is approved until the
        maintainer records source-specific permission or legal confirmation.
    api:
      available: official
      endpoint: https://data.usajobs.gov/api/Search
      docs: https://developer.usajobs.gov/api-reference/get-api-search
      authentication: api_key
      credential_secret: USAJOBS_AUTH_KEY
      user_agent_secret: USAJOBS_USER_AGENT_EMAIL
      required_secrets:
        - USAJOBS_AUTH_KEY
        - USAJOBS_USER_AGENT_EMAIL
      required_headers:
        - Authorization-Key
        - User-Agent
      cost: no_api_fee_documented
      terms_url: https://developer.usajobs.gov/guides/terms-of-use
      robots: api_only_no_html_scraping
      rate_limits: >
        unresolved_source_request_rate_limit: the official guide documents a
        maximum of 10000 rows per query and 500 rows per page, but no QPS or
        requests-per-minute budget. This is a blocker; do not invoke until the
        request-rate contract and polling cadence are confirmed.
      request_rate_limit: unknown_blocker
      polling_policy: disabled_until_source_limit_confirmed
      pagination: >
        Search uses Page and ResultsPerPage; default is 250 results per page and
        ResultsPerPage accepts up to 500.
    canonical_id: MatchedObjectId
    canonical_url: PositionURI
    canonical_hosts:
      - www.usajobs.gov
    query_parameters:
      - Keyword
      - RemunerationMinimumAmount
      - RemunerationMaximumAmount
      - PayGradeLow
      - PayGradeHigh
      - JobCategoryCode
      - LocationName
      - Organization
      - PositionOfferingTypeCode
      - PositionScheduleTypeCode
      - SecurityClearanceRequired
      - RemoteIndicator
      - WhoMayApply
    compensation_fields:
      - MatchedObjectDescriptor.PositionRemuneration[].MinimumRange
      - MatchedObjectDescriptor.PositionRemuneration[].MaximumRange
      - MatchedObjectDescriptor.PositionRemuneration[].RateIntervalCode
      - MatchedObjectDescriptor.PositionRemuneration[].Description
      - MatchedObjectDescriptor.JobGrade[].Code
      - MatchedObjectDescriptor.UserArea.Details.LowGrade
      - MatchedObjectDescriptor.UserArea.Details.HighGrade
    location_fields:
      - MatchedObjectDescriptor.PositionLocationDisplay
      - MatchedObjectDescriptor.PositionLocation[].LocationName
      - MatchedObjectDescriptor.PositionLocation[].CountryCode
      - MatchedObjectDescriptor.PositionLocation[].CountrySubDivisionCode
      - MatchedObjectDescriptor.PositionLocation[].CityName
      - MatchedObjectDescriptor.PositionLocation[].Longitude
      - MatchedObjectDescriptor.PositionLocation[].Latitude
    matching_fields:
      - MatchedObjectDescriptor.PositionTitle
      - MatchedObjectDescriptor.OrganizationName
      - MatchedObjectDescriptor.JobCategory[].Code
      - MatchedObjectDescriptor.PositionSchedule[].Code
      - MatchedObjectDescriptor.PositionOfferingType[].Code
      - MatchedObjectDescriptor.UserArea.Details.WhoMayApply
      - MatchedObjectDescriptor.PositionLocation[].LocationName
    allowed_matching_use: normalized_public_metadata_matching_and_filtering
    allowed_presentation_use: concise_listing_card_with_attributed_canonical_link
    job_text:
      retain: false
      display: false
      reason: full_announcement_text_is_outside_this_phase
    retention: >
      Store only approved normalized metadata and source timestamps. Delete or
      tombstone closed/deleted/expired listings and derived artifacts; purge no
      later than 30 days after the last successful confirmation.
    deletion_expiry_obligations:
      - stop_presenting_when_closed_deleted_or_expired
      - delete_normalized_record_or_tombstone
      - purge_search_indexes_caches_embeddings_and_fixture_copies
      - record_deletion_event_without_deleted_text
    geographic_scope: United States federal public jobs
    live_enabled: false
    ssrf_allowlist:
      - data.usajobs.gov
      - developer.usajobs.gov
      - www.opm.gov
      - www.usajobs.gov

