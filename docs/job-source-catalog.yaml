  - name: Hacker News Who Is Hiring
    url: https://news.ycombinator.com/
    kind: external
    approval_state: pending
    approval:
      state: pending
      owner: maintainer
      review_date: 2026-08-10
      evidence:
        - https://github.com/HackerNews/API
      notes: >
        Official API documents the public data shape and says there is currently
        no rate limit, but it does not grant a license for user-authored text or
        establish retention/deletion terms for an aggregator.
    api:
      available: official_public
      endpoint: https://hacker-news.firebaseio.com/v0/item/{id}.json
      docs: https://github.com/HackerNews/API
      authentication: none
      cost: free_public_api
      terms_url: https://github.com/HackerNews/API
      robots: api_only_no_page_crawling
      rate_limits: no_limit_documented_but_polling_budget_required
      pagination: item_ids_and_tree_traversal_not_page_tokens
    canonical_id: id
    canonical_url: https://news.ycombinator.com/item?id={id}
    canonical_hosts:
      - news.ycombinator.com
    compensation_fields: []
    location_fields: []
    matching_fields:
      - title
      - time
    allowed_matching_use: none_pending_user_text_license_review
    allowed_presentation_use: none_pending_user_text_license_review
    job_text:
      retain: false
      display: false
    retention: unresolved_user_authored_text_policy
    deletion_expiry_obligations: delete_or_stop_presenting_deleted_and_dead_items
    geographic_scope: global_unspecified
    live_enabled: false
    ssrf_allowlist: []

  - name: Greenhouse Job Board API
    url: https://boards-api.greenhouse.io/
    kind: external
    approval_state: pending
    approval:
      state: pending
      owner: maintainer
      review_date: 2026-08-10
      evidence:
        - https://developers.greenhouse.io/job-board.html
      notes: >
        Public employer-board API is documented, but this review did not verify
        a blanket right to aggregate every employer board or retain/display full
        descriptions. Employer-specific authorization and retention terms are
        required.
    api:
      available: public_employer_scoped
      endpoint: https://boards-api.greenhouse.io/v1/boards/{board_token}/jobs
      docs: https://developers.greenhouse.io/job-board.html
      authentication: none_for_published_jobs
      cost: not_stated
      terms_url: https://developers.greenhouse.io/job-board.html
      robots: api_only_for_authorized_board_no_scraping
      rate_limits: not_documented_in_review_blocker
      pagination: not_documented_in_review_blocker
    canonical_id: id
    canonical_url: absolute_url
    canonical_hosts: []
    compensation_fields:
      - pay_input_ranges
    location_fields:
      - location.name
      - offices
    matching_fields:
      - title
      - departments
      - offices
      - location
    allowed_matching_use: employer_authorized_board_only
    allowed_presentation_use: employer_approved_fields_and_canonical_link_only
    job_text:
