# Machine-readable external job source catalog for Phase 3 (#316).
# Human-readable governance record: docs/job-source-catalog.md.
# Unknown access, license, retention, or display conditions are blockers.

review:
  document: docs/job-source-catalog.yaml
  issue: 316
  review_date: 2026-08-10
  reviewed_by: crank.fyi maintainers (research record authored by autonomous agent)
  decision_owner: crank.fyi maintainers
  methodology: 'Reviewed official API/feed documentation for each candidate and recorded
    access, authorization, terms/license, robots policy, rate limits, pagination,
    retention, identity, fields, matching/presentation use, and blockers. No credentials,
    live responses, applicant data, or licensed datasets were stored. Terms must be
    re-verified before live enablement.

    '
live_enabled: false
mvp:
  source: USAJOBS
  rationale: 'USAJOBS is the strongest documented candidate, but it remains pending:
    the reviewed materials do not establish a license or source-specific permission
    for Crank''s proposed retention and presentation, and the request-rate contract
    is unresolved. No source in this catalog currently meets the full approval criteria;
    this is a candidate inventory, not an approval or selection.'
  live_enabled: false
  fixture_strategy: 'Use synthetic fixtures matching the documented Search response
    shape. Include only source-scoped ID, title, agency, location, salary/date fields,
    and a canonical URL; never commit credentials, live payloads, applicant data,
    or copied full announcement text.

    '
  data_classification: public_job_opportunity_metadata
  job_text_retained: false
  job_text_displayed: false
  deletion_policy: No retention or deletion period is authorized for a pending candidate.
    A future approved source must define source-specific expiry and deletion obligations
    before ingestion.
  ssrf:
    request_hosts:
    - data.usajobs.gov
    evidence_hosts:
    - developer.usajobs.gov
    - www.opm.gov
    presentation_hosts:
    - www.usajobs.gov
ssrf:
  require_https: true
  deny_private_and_link_local_addresses: true
  deny_unlisted_redirects: true
  user_supplied_urls: denied
  request_hosts:
  - data.usajobs.gov
  - remoteok.com
  - hacker-news.firebaseio.com
  - boards-api.greenhouse.io
  - api.lever.co
  - example.com
  evidence_hosts:
  - developer.usajobs.gov
  - www.opm.gov
  - remoteok.com
  - github.com
  - developers.greenhouse.io
  presentation_hosts:
  - www.usajobs.gov
  - remoteok.com
  - news.ycombinator.com
data_classification:
  approved_mvp: none_pending_source_review
  source_responses: untrusted_external_data
  prohibited: applicant_data_resumes_contact_details_inferred_sensitive_attributes
  raw_payload_retention: none
  job_text_retained: false
  job_text_displayed: false
sources:
- name: USAJOBS
  url: https://data.usajobs.gov/
  kind: external
  approval_state: pending
  approval:
    state: pending
    owner: crank.fyi maintainers
    review_date: 2026-08-10
    evidence:
    - https://developer.usajobs.gov/api-reference/
    - https://developer.usajobs.gov/api-reference/get-api-search
    - https://developer.usajobs.gov/guides/authentication
    - https://developer.usajobs.gov/guides/rate-limiting
    - https://developer.usajobs.gov/guides/terms-of-use
    - https://www.opm.gov/developer/
    notes: 'Pending: the cited API description is not a license and the Terms of Use
      page does not establish Crank''s proposed retention or presentation use. No
      live access or fixture-backed implementation is approved until the maintainer
      records source-specific permission or legal confirmation.

      '
  api:
    available: official
    endpoint: https://data.usajobs.gov/api/Search
    docs: https://developer.usajobs.gov/api-reference/get-api-search
    authentication: api_key
    credential_secret: USAJOBS_AUTH_KEY
    user_agent_secret: USAJOBS_USER_AGENT_EMAIL
    required_secrets:
    - USAJOBS_AUTH_KEY
    - USAJOBS_USER_AGENT_EMAIL
    required_headers:
    - Authorization-Key
    - User-Agent
    cost: no_api_fee_documented
    terms_url: https://developer.usajobs.gov/guides/terms-of-use
    robots: api_only_no_html_scraping
    rate_limits:
      request_rate: unknown_blocker
      requests_per_minute: null
      max_rows_per_query: 10000
      max_results_per_page: 500
      status: unresolved_source_contract
    request_rate_limit: unknown_blocker
    polling_policy: disabled_until_source_limit_confirmed
    pagination:
      style: page_number
      page_parameter: Page
      page_size_parameter: ResultsPerPage
      default_page_size: 250
      max_page_size: 500
      status: documented
  canonical_id: MatchedObjectId
  canonical_url: PositionURI
  canonical_hosts:
  - www.usajobs.gov
  query_parameters:
  - Keyword
  - RemunerationMinimumAmount
  - RemunerationMaximumAmount
  - PayGradeLow
  - PayGradeHigh
  - JobCategoryCode
  - LocationName
  - Organization
  - PositionOfferingTypeCode
  - PositionScheduleTypeCode
  - SecurityClearanceRequired
  - RemoteIndicator
  - WhoMayApply
  compensation_fields:
  - MatchedObjectDescriptor.PositionRemuneration[].MinimumRange
  - MatchedObjectDescriptor.PositionRemuneration[].MaximumRange
  - MatchedObjectDescriptor.PositionRemuneration[].RateIntervalCode
  - MatchedObjectDescriptor.PositionRemuneration[].Description
  - MatchedObjectDescriptor.JobGrade[].Code
  - MatchedObjectDescriptor.UserArea.Details.LowGrade
  - MatchedObjectDescriptor.UserArea.Details.HighGrade
  location_fields:
  - MatchedObjectDescriptor.PositionLocationDisplay
  - MatchedObjectDescriptor.PositionLocation[].LocationName
  - MatchedObjectDescriptor.PositionLocation[].CountryCode
  - MatchedObjectDescriptor.PositionLocation[].CountrySubDivisionCode
  - MatchedObjectDescriptor.PositionLocation[].CityName
  - MatchedObjectDescriptor.PositionLocation[].Longitude
  - MatchedObjectDescriptor.PositionLocation[].Latitude
  matching_fields:
  - MatchedObjectDescriptor.PositionTitle
  - MatchedObjectDescriptor.OrganizationName
  - MatchedObjectDescriptor.JobCategory[].Code
  - MatchedObjectDescriptor.PositionSchedule[].Code
  - MatchedObjectDescriptor.PositionOfferingType[].Code
  - MatchedObjectDescriptor.UserArea.Details.WhoMayApply
  - MatchedObjectDescriptor.PositionLocation[].LocationName
  allowed_matching_use: none
  allowed_presentation_use: none
  job_text:
    retain: false
    display: false
    reason: full_announcement_text_is_outside_this_phase
  retention: none
  deletion_expiry_obligations: []
  geographic_scope: United States federal public jobs
  live_enabled: false
  ssrf:
    request_hosts:
    - data.usajobs.gov
    evidence_hosts:
    - developer.usajobs.gov
    - www.opm.gov
    presentation_hosts:
    - www.usajobs.gov
  effective_permissions:
    matching: none
    presentation: none
    ingestion: false
  ingestion_policy: none
  operational_controls:
    timeout_seconds: 10
    max_response_size_bytes: 1048576
    retry:
      max_attempts: 3
      backoff_seconds: 1
      max_backoff_seconds: 30
      on_statuses:
      - 429
      - 500
      - 502
      - 503
      - 504
    concurrency_limit: 1
    polling_budget:
      max_requests_per_run: 0
      min_interval_seconds: 60
      status: disabled_until_approved
    failure_alert: record_sanitized_run_failure_and_alert_maintainer
