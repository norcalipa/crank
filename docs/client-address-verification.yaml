#
# Operator verification records for the trusted client address (issue #538).
# How to fill one in: docs/runbook-client-address.md ("Record, then enable").
#
# Rule: a record holds dates and pass/fail values only. Never write an
# address, a hostname, a tunnel id or any other detail of the network here.
#
# CI (crank/tests/test_client_address.py) refuses CLIENT_IP_SOURCE: "cloudflare"
# in k8s/crank-configmap.yml unless the LAST record below passes. A record is
# the operator's attestation; CI cannot check that it is true.
#
# The same test refuses the switch in any other tracked file: another
# manifest, a workflow, a script, an image file, a tracked .env. It cannot see
# what is applied to the cluster by hand, the contents of Secrets the operator
# creates or of secrets files (it never opens them), a name assembled at run
# time, or environment set outside the repository. The runbook's "What CI
# cannot see" is the whole list; its V1 step checks the running pod.
#
# Fields of one record:
#   date: "YYYY-MM-DD"            the day the checks were run; not in the future
#   verified_by: "<name>"         a name or handle
#   g1_public_path: pass | fail
#   g2_private_path: pass | waived | fail
#   g2_method: nodeport-addresses | clusterip | firewall | waived
#   edge_header_checks: pass | fail
verifications: []
