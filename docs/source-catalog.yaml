#
# External rating source catalog for Phase 2 ("Score Gathering").
# Governance deliverable for #310. Human-readable narrative: docs/source-catalog.md.
#
# Approval states:
#   approved  - intended use and access path accepted; adapter may be built
#               against the documented official API/feed. `live_enabled` is
#               separately false until an operator provisions access keys,
#               because secrets must never be committed.
#   pending   - access path exists but is not yet lawful/admissible without
#               further review or an explicit data/budget decision.
#   blocked   - no acceptable lawful access path for this slice (no public
#               API, scraping prohibited, paid/commercial-only, decommissioned).
#   excluded  - not an external rating source (internal/self, or not attributable).
#
# Every source with seed `gives_ratings: true` is listed below (validated against
# seeds/crank.organization.yaml by crank/tests/test_source_catalog.py).
# Facts were verified by an autonomous agent on the review_date below using the
# cited pages plus DNS/endpoint checks. Terms change; re-verify before enabling.
review:
  document: docs/source-catalog.yaml
  review_date: 2026-08-07
  reviewed_by: autonomous agent (implementation of #310)
  decision_owner: maintainer (crank.fyi)
  methodology: >
    For each seeded rating organization we recorded official API/feed existence,
    authentication, license/terms, robots stance, allowed use, retention, rate
    limits, cadence, geographic scope, and sample data shape. Public DNS and
    documented pages were checked on the review date; no credentials or licensed
    content were obtained or stored.

mvp:
  source: Google
  score_type: Reputation
  rationale: >
    Only seeded rating organization with a currently-documented official API
    (Google Maps Platform Places API) and a usable free usage tier. Yelp is
    now paid-only, Levels.fyi/Salary.com/Simply Wall St are commercial, and
    StackShare's API no longer resolves.
  access: >
    Official Google Maps Platform Places web-service API (Place Details).
    Self-service sign-up, authentication via a Google Cloud API key supplied
    as an environment secret (never committed). A Google Cloud billing account
    is required to enable the API; usage is bounded by the per-SKU free tier
    (Google restructured pricing in March 2025 - verify the exact free cap at
    implementation and do not configure paid overage).
  score_types:
    - Reputation
    - Culture
  fields:
    - rating            # 0.0-5.0 aggregate float
    - user_ratings_total # integer count
    - types             # category labels (informational)
    - price_level       # optional, 0-4
  retention: >
    Google Maps Platform Terms permit caching Places content for up to 30 days.
    Crank stores only the normalized numeric aggregate (Score.value) and the
    observation timestamp; it does not persist raw API payloads or review text
    beyond the normalization step. Raw responses are discarded after use.
  rate_limits: >
    Per-project QPS and per-SKU free monthly usage caps; defaults are
    documented by Google. Recorded in the source contract at adapter build;
    stays within the free tier and never enables paid overage.
  cadence: daily
  geographic: global
  fixture_plan: >
    Operator provisions a Places API key in the staging environment via env
    (never committed), fetches Place Details for a handful of seeded
    organizations that have a Google Business Profile, and commits a sanitized,
    aggregate-only fixture (rating + user_ratings_total + types; NO review text,
    NO addresses, NO contact data) for offline adapter/tests. Live scheduled
    ingestion remains disabled until the key is provisioned and the Terms are
    accepted by the maintainer.
  live_enabled: false
  ssrf_allowlist:
    - places.googleapis.com
    - maps.googleapis.com
  data_classification: >
    Public business metadata (aggregate star rating and review count). Not
    confidential, not personal data. We ingest numeric aggregates only and never
    store free-text reviews (avoiding copyrighted reviewer content and PII).

