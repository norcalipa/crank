follow_up_gaps:
  - Provision a Google Cloud Places API key in staging via env secret (never committed) and keep usage inside the per-SKU free tier (no paid overage).
  - Maintainer to explicitly accept the Google Maps Platform Terms (30-day caching; free-tier attribution/display obligations) before enabling live runs.
  - Confirm at adapter build whether to target Places API (New) host `places.googleapis.com` or legacy `maps.googleapis.com`; keep both domains on the SSRF allowlist until then.
  - Re-verify Google per-SKU free caps and rate limits at implementation time (pricing was restructured March 2025).
  - Levels.fyi remains the preferred follow-up for the "Total Compensation" slice if a budget/commercial licence is approved.
  - Re-check BBB for an official licensee data channel if reputation accreditation data is desired.
