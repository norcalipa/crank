version: 1
event_type: CrankOperation
allowed_event_names:
  - interactive_call
  - scheduled_run
  - source_stage
  - matching_batch
  - operational_change
  - crawl_planning
  - crawl_run_started
  - crawl_run_completed
  - crawl_run_failed
  - crawl_run_skipped
  - inventory_health
  - job_search_turn
  - job_search_tool_invocation
  - job_search_helpfulness_gap
  - assistant_turn
  - assistant_first_result
  - availability_state
  - preference_decision
  - pipeline_health
  - publication_sweep
facets:
  - run_type
  - stage
  - source_key
  - reason_code
  - tool
  - phase
  - state
  - surface
  - failure_stage
  - decision
  - origin
  - status
widgets:
  - name: Last successful scheduled run
    nrql: >-
      SELECT latest(timestamp) FROM CrankOperation WHERE event_name = 'scheduled_run'
      AND status = 'succeeded' SINCE 7 days ago
  - name: Run duration and throughput
    nrql: >-
      SELECT average(duration_ms), count(*) FROM CrankOperation
      WHERE event_name = 'scheduled_run' FACET run_type TIMESERIES SINCE 24 hours ago
  - name: Failures by reason and source stage
    nrql: >-
      SELECT count(*) FROM CrankOperation WHERE status = 'failed'
      FACET event_name, stage, source_key, reason_code SINCE 24 hours ago
  - name: Source freshness
    nrql: >-
      SELECT latest(freshness_seconds) FROM CrankOperation
      WHERE event_name = 'source_stage' FACET source_key SINCE 24 hours ago
  - name: Job inventory health
    nrql: >-
      SELECT latest(sources_total), latest(enabled_sources), latest(active_listings),
      latest(stale_sources), latest(repeated_failure_sources), latest(collapsed_sources),
      latest(unregistered_adapter_sources)
      FROM CrankOperation WHERE event_name = 'inventory_health' SINCE 24 hours ago
  - name: Estimated cost and token throughput
    nrql: >-
      SELECT sum(estimated_cost_usd), sum(total_tokens), count(*)
      FROM CrankOperation WHERE event_name = 'interactive_call' SINCE 24 hours ago
  - name: Assistant turn quality
    nrql: >-
      SELECT count(*), average(tools_called), sum(cited_ids_count)
      FROM CrankOperation WHERE event_name = 'job_search_turn' SINCE 24 hours ago
  - name: Tool invocation volume
    nrql: >-
      SELECT count(*) FROM CrankOperation
      WHERE event_name = 'job_search_tool_invocation' FACET tool SINCE 24 hours ago
  - name: Helpfulness gaps
    nrql: >-
      SELECT count(*), average(turns_without_result)
      FROM CrankOperation WHERE event_name = 'job_search_helpfulness_gap' SINCE 7 days ago
  - name: Listing lifecycle closure and retention
    nrql: >-
      SELECT sum(listings_closed), sum(listings_expired), sum(listings_deleted)
      FROM CrankOperation WHERE event_name = 'source_stage'
      FACET source_key, reason_code SINCE 24 hours ago
  - name: Deadline, rejection, and backlog pressure
    nrql: >-
      SELECT sum(deadline_reached), sum(items_failed), sum(users_failed),
      sum(matches_persisted) FROM CrankOperation WHERE event_name = 'matching_batch'
      SINCE 24 hours ago
  - name: Source freshness scheduling pressure
    nrql: >-
      SELECT latest(sources_eligible), sum(sources_deferred), sum(sources_skipped),
      max(oldest_source_age_hours), sum(deferred_backoff), sum(skipped_fresh),
      sum(skipped_policy), max(oldest_due_age_hours)
      FROM CrankOperation WHERE event_name = 'scheduled_run'
      SINCE 24 hours ago
  - name: Assistant turn funnel
    nrql: >-
      SELECT count(*) FROM CrankOperation WHERE event_name = 'assistant_turn'
      FACET phase, failure_stage, reason_code SINCE 7 days ago
  - name: Assistant availability states
    nrql: >-
      SELECT count(*) FROM CrankOperation WHERE event_name = 'availability_state'
      FACET surface, state SINCE 7 days ago
  - name: Time to first result
    nrql: >-
      SELECT percentile(seconds_to_first_result, 50, 90), average(turns_to_first_result)
      FROM CrankOperation WHERE event_name = 'assistant_first_result' SINCE 14 days ago
  - name: Preference decisions
    nrql: >-
      SELECT count(*) FROM CrankOperation WHERE event_name = 'preference_decision'
      FACET decision, origin, status SINCE 7 days ago
  - name: Publication-to-match lag
    nrql: >-
      SELECT max(publication_lag_max_seconds), sum(publication_lag_count)
      FROM CrankOperation WHERE event_name = 'matching_batch' SINCE 14 days ago
  - name: Pipeline backlog and evidence freshness gauges
    nrql: >-
      SELECT latest(queued_runs), latest(oldest_queued_age_seconds), latest(outbox_pending),
      latest(outbox_oldest_age_seconds), latest(observations_pending),
      latest(unresolved_employers), latest(users_without_generation),
      latest(accepted_evidence_rows), latest(evidence_stale_rows),
      latest(evidence_oldest_verified_days), latest(organizations_with_evidence),
      latest(organizations_active) FROM CrankOperation
      WHERE event_name = 'pipeline_health' SINCE 24 hours ago
  - name: Publication sweep
    nrql: >-
      SELECT count(*), sum(processed), sum(keys_deleted), max(outbox_oldest_age_seconds)
      FROM CrankOperation WHERE event_name = 'publication_sweep' FACET status SINCE 24 hours ago
metrics:
  - name: assistant_turn_success_rate
    event: assistant_turn
    definition: replied turns divided by attempted turns, by failure_stage
    dimensions: [phase, failure_stage]
    owner: maintainer (crank.fyi)
    runbook: docs/monitoring.md#assistant-and-data-freshness-metrics
    baseline_only: true
  - name: time_to_first_result
    event: assistant_first_result
    definition: seconds from the start of the current chat session (first user message after an idle gap over 30 minutes) to the conversation's first non-empty result; turns_to_first_result counts assistant turns across the whole conversation
    dimensions: []
    owner: maintainer (crank.fyi)
    runbook: docs/monitoring.md#assistant-and-data-freshness-metrics
    baseline_only: true
  - name: availability_state_mix
    event: availability_state
    definition: count of served assistant availability states per surface
    dimensions: [surface, state]
    owner: maintainer (crank.fyi)
    runbook: docs/monitoring.md#assistant-and-data-freshness-metrics
    baseline_only: true
  - name: preference_decision_outcomes
    event: preference_decision
    definition: apply, dismiss, undo and reset outcomes including stale and invalid, split by origin (proposal, direct, reset)
    dimensions: [decision, origin, status]
    owner: maintainer (crank.fyi)
    runbook: docs/monitoring.md#assistant-and-data-freshness-metrics
    baseline_only: true
  - name: publication_to_match_lag
    event: matching_batch
    definition: seconds from the oldest publication in a revision window to the match generation that published it
    dimensions: []
    owner: maintainer (crank.fyi)
    runbook: docs/monitoring.md#assistant-and-data-freshness-metrics
    baseline_only: true
  - name: evidence_staleness
    event: pipeline_health
    definition: accepted evidence rows past FIELD_FRESHNESS_POLICY over all accepted rows, plus oldest verification age in days
    dimensions: []
    owner: maintainer (crank.fyi)
    runbook: docs/monitoring.md#assistant-and-data-freshness-metrics
    baseline_only: true
  - name: pipeline_backlog
    event: pipeline_health
    definition: queued runs, outbox, review and unresolved-employer backlog sizes and oldest ages
    dimensions: []
    owner: maintainer (crank.fyi)
    runbook: docs/monitoring.md#assistant-and-data-freshness-metrics
    baseline_only: true
# Release decision gates (issue #492). Evidence queries for staged release
# decisions; these are NOT alerts and page nobody. `provisional` gates carry a
# number that already exists in docs/rollout-gates.md (see `source`);
# `baseline_required` gates have no threshold until 14 days of data exist with
# the capability enabled. Below `min_sample` events in the window the decision
# is "hold - insufficient data", never "pass".
release_gates:
  - name: priorities-apply-success
    phase: shell
    switch: null
    kind: nrql
    status: baseline_required
    event: preference_decision
    nrql: >-
      SELECT filter(count(*), WHERE status = 'applied') / count(*)
      FROM CrankOperation WHERE event_name = 'preference_decision'
      AND decision = 'apply' SINCE 14 days ago
    operator: below
    threshold: null
    min_sample: 1
    window: 14 days
    on_breach: hold the shell decision and file a follow-up issue
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: interactive-reply-success
    phase: interactive_replies
    switch: interactive_agent
    kind: nrql
    status: provisional
    event: assistant_turn
    nrql: >-
      SELECT filter(count(*), WHERE phase = 'replied') /
      filter(count(*), WHERE phase = 'attempted')
      FROM CrankOperation WHERE event_name = 'assistant_turn' SINCE 7 days ago
    operator: below
    threshold: 0.90
    min_sample: 1
    window: 7 days
    source: docs/rollout-gates.md#carried-over-thresholds-for-492-gates
    on_breach: disable the interactive_agent switch, then open a revert PR
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: interactive-alerts-quiet
    phase: interactive_replies
    switch: interactive_agent
    kind: alerts_quiet
    status: provisional
    alerts: [cost-limit, recurring-helpfulness-gaps, repeated-failure]
    operator: above
    threshold: 0
    window: 7 days
    source: docs/rollout-gates.md#carried-over-thresholds-for-492-gates
    on_breach: follow the alert's recovery text; hold expansion
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: interactive-time-to-first-result
    phase: interactive_replies
    switch: interactive_agent
    kind: nrql
    status: baseline_required
    event: assistant_first_result
    nrql: >-
      SELECT percentile(seconds_to_first_result, 50) FROM CrankOperation
      WHERE event_name = 'assistant_first_result' SINCE 14 days ago
    operator: above
    threshold: null
    min_sample: 1
    window: 14 days
    on_breach: hold expansion and file a follow-up issue
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: assistant-ready-share
    phase: interactive_replies
    switch: interactive_agent
    kind: nrql
    status: baseline_required
    event: availability_state
    nrql: >-
      SELECT filter(count(*), WHERE state = 'ready') / count(*)
      FROM CrankOperation WHERE event_name = 'availability_state'
      AND surface = 'assistant_status' AND state != 'signed_out' SINCE 7 days ago
    operator: below
    threshold: null
    min_sample: 1
    window: 7 days
    on_breach: hold expansion and inspect the availability state mix
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: job-source-alerts-quiet
    phase: job_source
    switch: job_pipeline
    kind: alerts_quiet
    status: provisional
    alerts:
      - zero-enabled-sources
      - zero-active-listings
      - stale-inventory
      - repeated-failures
      - listing-collapse
      - no-recent-success
      - rejection-spike
    operator: above
    threshold: 0
    window: 7 days
    source: docs/rollout-gates.md#carried-over-thresholds-for-492-gates
    on_breach: follow the alert's recovery text; disable the affected source
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: job-matches-source-unavailable
    phase: job_source
    switch: job_pipeline
    kind: nrql
    status: provisional
    event: availability_state
    nrql: >-
      SELECT count(*) FROM CrankOperation WHERE event_name = 'availability_state'
      AND surface = 'job_matches' AND state IN ('no_source', 'source_disabled')
      SINCE 7 days ago
    operator: above
    threshold: 0
    min_sample: 1
    window: 7 days
    source: docs/rollout-gates.md#carried-over-thresholds-for-492-gates
    on_breach: do not describe the phase as live jobs; hold or roll back
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: publication-outbox-age
    phase: publication
    switch: publication_consumer
    kind: nrql
    status: baseline_required
    event: pipeline_health
    nrql: >-
      SELECT latest(outbox_oldest_age_seconds) FROM CrankOperation
      WHERE event_name = 'pipeline_health' SINCE 24 hours ago
    operator: above
    threshold: null
    min_sample: 1
    window: 14 days
    on_breach: hold expansion and inspect the publication sweep
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: publication-to-match-lag
    phase: match_recompute
    switch: match_recompute
    kind: nrql
    status: baseline_required
    event: matching_batch
    nrql: >-
      SELECT max(publication_lag_max_seconds) FROM CrankOperation
      WHERE event_name = 'matching_batch' AND publication_lag_count > 0
      SINCE 14 days ago
    operator: above
    threshold: null
    min_sample: 1
    window: 14 days
    on_breach: hold expansion and inspect the recompute drain
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: matching-alerts-quiet
    phase: match_recompute
    switch: match_recompute
    kind: alerts_quiet
    status: provisional
    alerts: [matching-backlog, deadline-resource-pressure]
    operator: above
    threshold: 0
    window: 7 days
    source: docs/rollout-gates.md#carried-over-thresholds-for-492-gates
    on_breach: follow the alert's recovery text; hold expansion
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
  - name: evidence-stale-share
    phase: organization_crawl
    switch: crawl_schedule
    kind: nrql
    status: baseline_required
    event: pipeline_health
    nrql: >-
      SELECT latest(evidence_stale_rows) / latest(accepted_evidence_rows)
      FROM CrankOperation WHERE event_name = 'pipeline_health' SINCE 24 hours ago
    operator: above
    threshold: null
    min_sample: 1
    window: 14 days
    on_breach: hold expansion and inspect organization crawl freshness
    runbook: docs/rollout-gates.md#contextual-assistant-staged-release-492
alerts:
  - name: repeated-failure
    nrql: "SELECT count(*) FROM CrankOperation WHERE status = 'failed' AND event_name NOT IN ('publication_sweep', 'preference_decision') SINCE 15 minutes ago"
    threshold: 3
    operator: above
    recovery: "Inspect sanitized AgentRun/SourceRun, then disable the affected source or capability."
  - name: no-recent-success
    nrql: "SELECT count(*) FROM CrankOperation WHERE event_name = 'scheduled_run' AND status = 'succeeded' SINCE 6 hours ago"
    threshold: 1
    operator: below
    recovery: "Check scheduler, overlap/stale-run state, and run the bounded recovery procedure."
  - name: deadline-resource-pressure
    nrql: "SELECT sum(deadline_reached) FROM CrankOperation WHERE event_name = 'matching_batch' SINCE 30 minutes ago"
    threshold: 1
    operator: above
    recovery: "Reduce configured bounded work or raise the approved deadline after review."
  - name: cost-limit
    nrql: "SELECT sum(estimated_cost_usd) FROM CrankOperation WHERE event_name = 'interactive_call' SINCE 1 day ago"
    threshold: 10
    operator: above
    recovery: "Disable interactive_agent and inspect token/cost settings before re-enabling."
  - name: rejection-spike
    nrql: "SELECT sum(items_failed) FROM CrankOperation WHERE event_name = 'source_stage' SINCE 30 minutes ago"
    threshold: 20
    operator: above
    recovery: "Inspect reason-coded source failures and isolate the source; no raw response is retained."
  - name: matching-backlog
    nrql: "SELECT sum(users_failed) FROM CrankOperation WHERE event_name = 'matching_batch' SINCE 30 minutes ago"
    threshold: 10
    operator: above
    recovery: "Inspect deadline/resource pressure and keep the job_pipeline capability disabled until safe."
  - name: zero-enabled-sources
    nrql: "SELECT count(*) FROM CrankOperation WHERE event_name = 'inventory_health' AND enabled_sources = 0 SINCE 30 minutes ago"
    threshold: 1
    operator: above
    recovery: "Run seed_job_sources --dry-run then seed_job_sources; verify with crawl_status."
  - name: zero-active-listings
    nrql: "SELECT count(*) FROM CrankOperation WHERE event_name = 'inventory_health' AND active_listings = 0 AND enabled_sources > 0 SINCE 30 minutes ago"
    threshold: 1
    operator: above
    recovery: "Run crawl_status and trigger one bounded crawl; check provider credentials and adapter state."
  - name: recurring-helpfulness-gaps
    nrql: "SELECT count(*) FROM CrankOperation WHERE event_name = 'job_search_helpfulness_gap' SINCE 1 day ago"
    threshold: 3
    operator: above
    recovery: "Inspect assistant/LLM grounding: verify the orchestrator provider is selected in production and the anti-echo guard is intact."
  - name: stale-inventory
    nrql: "SELECT count(*) FROM CrankOperation WHERE event_name = 'inventory_health' AND stale_sources > 0 SINCE 30 minutes ago"
    threshold: 1
    operator: above
    recovery: "Verify CRAWL_CRON_ENABLED and the crawl CronJobs are unsuspended, then run a bounded schedule_crawls."
  - name: repeated-failures
    nrql: "SELECT count(*) FROM CrankOperation WHERE event_name = 'inventory_health' AND repeated_failure_sources > 0 SINCE 30 minutes ago"
    threshold: 1
    operator: above
    recovery: "Inspect sanitized CrawlRun history, isolate the failing source, and re-enable only after a confirmed healthy run."
  - name: listing-collapse
    nrql: "SELECT count(*) FROM CrankOperation WHERE event_name = 'inventory_health' AND collapsed_sources > 0 SINCE 30 minutes ago"
    threshold: 1
    operator: above
    recovery: "Inspect the source that lost all active listings and re-run a bounded crawl before re-seeding or re-enabling."
