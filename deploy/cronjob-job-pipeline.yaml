# Disabled by default. Enable both the CronJob and application settings only
# after source policy, credentials, and matching policy have been reviewed.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crank-job-pipeline
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
    app.kubernetes.io/component: job-pipeline
spec:
  schedule: "0 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crank
            app.kubernetes.io/instance: crank
            app.kubernetes.io/component: job-pipeline
        spec:
          restartPolicy: OnFailure
          serviceAccountName: crank-agent
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: crank-agent
              image: ghcr.io/norcalipa/crank/crank:${GITHUB_SHA}
              imagePullPolicy: Always
              command: ["python", "manage.py", "run_job_pipeline"]
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
              envFrom:
                - configMapRef:
                    name: crank-config
                - configMapRef:
                    name: crank-agent-config
                - secretRef:
                    name: db-connect-credentials
          imagePullSecrets:
            - name: ghcr-credentials
          volumes:
            - name: tmp
              emptyDir: {}
