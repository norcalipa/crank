# Disabled by default. Enable both the CronJob and application settings only
# after source policy, credentials, and matching policy have been reviewed.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: crank-job-pipeline
  namespace: crank
  labels:
    app.kubernetes.io/name: crank
    app.kubernetes.io/instance: crank
    app.kubernetes.io/component: job-pipeline
spec:
  schedule: "0 */6 * * *"
  suspend: true
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: crank
            app.kubernetes.io/instance: crank
            app.kubernetes.io/component: job-pipeline
        spec:
          restartPolicy: OnFailure
          serviceAccountName: crank-agent
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            fsGroup: 10000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: crank-agent
              image: ghcr.io/norcalipa/crank/crank:${GITHUB_SHA}
              imagePullPolicy: Always
              command: ["python", "manage.py", "run_job_pipeline"]
              securityContext:
                allowPrivilegeEscalation: false
                privileged: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "100m"
                limits:
                  memory: "1Gi"
                  cpu: "1"
              envFrom:
                - configMapRef:
                    name: crank-config
                - configMapRef:
                    name: crank-agent-config
                - secretRef:
                    name: db-connect-credentials
                - secretRef:
                    name: crank-capability-secrets
          imagePullSecrets:
            - name: ghcr-credentials
          # `fats` is the k3s host (192.168.0.10) that runs MySQL on :3306; it is
          # not a Kubernetes Service, so inject it into /etc/hosts (same as
          # k8s/crank-cronjob.yml).
          # Public resolvers are appended because in-cluster CoreDNS cannot
          # resolve external names from pods.
          hostAliases:
            - ip: "192.168.0.10"
              hostnames:
                - "fats"
          dnsPolicy: ClusterFirst
          dnsConfig:
            nameservers:
              - 8.8.8.8
              - 1.1.1.1
            options:
              - name: timeout
                value: "2"
              - name: attempts
                value: "3"
          volumes:
            - name: tmp
              emptyDir: {}
