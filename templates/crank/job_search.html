{% extends "base.html" %}
{% load static %}
{% load manifest %}

{% block head_title %}Job Search{% endblock %}

{% block content %}
    <div class="container py-4 page-container">
        <div class="row">
            <div class="col-12">
                <h1 class="h2 mb-1">
                    <i class="fa-solid fa-comments"></i> CRank Job Search Assistant
                </h1>
                <p class="text-muted">
                    Talk to the assistant about your job preferences. Messages are
                    saved to your account and are private to you.
                </p>
            </div>
        </div>
        <div class="row">
            <div class="col-12 col-lg-8">
                <div id="job-match-panel"></div>
                <div id="job-search-chat"></div>
            </div>
        </div>
        <noscript>
            <div class="alert alert-warning mt-3" role="alert">
                The job search assistant needs JavaScript enabled.
            </div>
        </noscript>
    </div>
    <script type="text/javascript" src="{% manifest 'jobsearch.js' %}"></script>
    <script type="text/javascript" src="{% manifest 'jobmatch.js' %}"></script>
{% endblock %}
